name: TASK-004 formatter repair

on:
  push:
    branches:
      - loopforge/task-004-teacher-lifecycle

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: loopforge/task-004-teacher-lifecycle
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply repository-pinned formatting
        run: |
          npx prettier --write \
            src/app/browser-smoke/teacher-lifecycle/page.tsx \
            'src/app/workspace/[organizationSlug]/teacher/actions.ts' \
            'src/app/workspace/[organizationSlug]/teacher/classes/[classId]/page.tsx' \
            'src/app/workspace/[organizationSlug]/teacher/page.tsx' \
            src/modules/classroom/database-contract.test.ts \
            src/modules/classroom/domain/upload-policy.test.ts \
            src/modules/classroom/domain/upload-policy.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/app/browser-smoke/teacher-lifecycle/page.tsx \
            'src/app/workspace/[organizationSlug]/teacher/actions.ts' \
            'src/app/workspace/[organizationSlug]/teacher/classes/[classId]/page.tsx' \
            'src/app/workspace/[organizationSlug]/teacher/page.tsx' \
            src/modules/classroom/database-contract.test.ts \
            src/modules/classroom/domain/upload-policy.test.ts \
            src/modules/classroom/domain/upload-policy.ts
          git rm .github/workflows/task004-format.yml
          git commit -m 'style: format TASK-004 implementation'
          git push origin HEAD:loopforge/task-004-teacher-lifecycle
