name: TASK-004 hosted test correction

on:
  push:
    branches:
      - loopforge/task-004-teacher-lifecycle

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: loopforge/task-004-teacher-lifecycle
      - name: Align attendance fixture with authorized teacher path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/tests/003_teacher_class_lifecycle_rls.sql')
          text = path.read_text()
          old = '''insert into public.attendance_records (
            organization_id, branch_id, class_id, lesson_session_id,
            organization_membership_id, status, recorded_by
          )
          select class_row.organization_id, class_row.branch_id, class_row.id, session.id,
                 membership.id, 'present', '30000000-0000-0000-0000-000000000003'
          from public.classes class_row
          join public.lesson_sessions session on session.class_id = class_row.id
          join public.organization_memberships membership on membership.user_id = '30000000-0000-0000-0000-000000000005'
          where class_row.code = 'LIFE-MATH-A';'''
          new = '''insert into public.attendance_records (
            organization_id, branch_id, class_id, lesson_session_id,
            organization_membership_id, status, recorded_by
          )
          select class_row.organization_id, class_row.branch_id, class_row.id, session.id,
                 enrollment.organization_membership_id, 'present', '30000000-0000-0000-0000-000000000003'
          from public.classes class_row
          join public.lesson_sessions session on session.class_id = class_row.id
          join public.class_enrollments enrollment
            on enrollment.organization_id = class_row.organization_id
           and enrollment.branch_id = class_row.branch_id
           and enrollment.class_id = class_row.id
           and enrollment.status = 'enrolled'
          where class_row.code = 'LIFE-MATH-A';'''
          if old not in text:
              raise SystemExit('expected attendance fixture block not found')
          path.write_text(text.replace(old, new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/tests/003_teacher_class_lifecycle_rls.sql
          git rm .github/workflows/task004-hosted-test-fix.yml
          git commit -m 'test: exercise authorized attendance fixture path [TASK-004]'
          git push origin HEAD:loopforge/task-004-teacher-lifecycle
