name: TASK-004 implementation sync

on:
  push:
    branches:
      - loopforge/task-004-teacher-lifecycle

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: loopforge/task-004-teacher-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Restore, format, and commit TASK-004 bundle
        shell: bash
        run: |
          git show 5f694a60669bb2c435df35fd92a00ae6e556b2d1:.github/workflows/task004-sync.yml \
            | sed -n "/cat > \/tmp\/task004.b64 <<'PAYLOAD'/,/^PAYLOAD$/p" \
            | sed '1d;$d' > /tmp/task004.b64
          test -s /tmp/task004.b64
          base64 --decode /tmp/task004.b64 | tar -xzf -
          npx prettier --write \
            .github/workflows/ci.yml \
            scripts/verify-teacher-keyboard.mjs \
            src/app/browser-smoke/teacher-lifecycle \
            src/app/workspace/page.tsx \
            'src/app/workspace/[organizationSlug]/teacher' \
            src/modules/classroom \
            src/types/database.ts \
            supabase/migrations/20260812065000_teacher_class_lifecycle.sql \
            supabase/tests/003_teacher_class_lifecycle_rls.sql
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml scripts/verify-teacher-keyboard.mjs src/app/browser-smoke/teacher-lifecycle src/app/workspace/page.tsx 'src/app/workspace/[organizationSlug]/teacher' src/modules/classroom src/types/database.ts supabase/migrations/20260812065000_teacher_class_lifecycle.sql supabase/tests/003_teacher_class_lifecycle_rls.sql
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: implement guided teacher class lifecycle [TASK-004]'
          git push origin HEAD:loopforge/task-004-teacher-lifecycle
