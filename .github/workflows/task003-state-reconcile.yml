name: TASK-003 state reconciliation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Reconcile verified TASK-003 state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          tasks_path = Path('.loopforge/tasks.json')
          tasks = json.loads(tasks_path.read_text())
          for task in tasks['tasks']:
              if task['id'] == 'TASK-003':
                  task['status'] = 'completed'
              elif task['id'] == 'TASK-004':
                  task['status'] = 'ready'
          tasks_path.write_text(json.dumps(tasks, indent=2) + '\n')

          blockers_path = Path('.loopforge/blockers.json')
          blockers = json.loads(blockers_path.read_text())
          for blocker in blockers['blockers']:
              if blocker['id'] == 'BLOCKER-014':
                  blocker['summary'] = (
                      "The historical Vercel integration identifies SkillForge as project "
                      "prj_IWxn6mdD5LaB9hc4KtuMujtDoNQ8 under team team_BPsOfcrNMh4WJBgbw8eMcXuN "
                      "(current connected team slug xash-mind0). The connected team currently lists zero projects; "
                      "direct project and historical deployment lookups return 404, while listing deployments for "
                      "that project ID returns 403. This does not conclusively prove deletion, so creating a replacement "
                      "could duplicate the intended project. Recover access/linkage before release and preserve the "
                      "canonical destination skillforge-bay-three.vercel.app."
                  )
          blockers_path.write_text(json.dumps(blockers, indent=2) + '\n')

          state = {
              "schemaVersion": 1,
              "mode": "new",
              "status": "active",
              "phase": "READY",
              "iteration": 3,
              "activeTaskId": "TASK-004",
              "activeChangeRequestId": None,
              "lastVerifiedCommit": "632b418b00e7c953efb308bdc49480532a8877c7",
              "lastRunId": "RUN-0013",
              "repairAttemptsForRootCause": 0,
              "completionCandidate": False,
              "criticalBlockers": [],
              "nextAction": "Implement TASK-004: the guided teacher class lifecycle with attendance, uploads and retry recovery, homework, AI-review placeholder, explicit teacher review, publish gate, and mobile-first verification.",
              "needsHuman": False,
              "updatedAt": "2026-08-12T06:36:12Z"
          }
          Path('.loopforge/state.json').write_text(json.dumps(state, indent=2) + '\n')

          run = {
              "schemaVersion": 1,
              "id": "RUN-0013",
              "mode": "new",
              "iteration": 3,
              "objective": "Reconcile repository reality and complete TASK-003 verification after its merged CI failure.",
              "taskId": "TASK-003",
              "changeRequestId": None,
              "startingCommit": "efff9d298319132a0c7b20a6c21ec95d47306c5b",
              "endingCommit": "632b418b00e7c953efb308bdc49480532a8877c7",
              "implementation": [
                  "Applied Prettier 3.9.6 to the nine TASK-003 files that blocked the merged quality gate.",
                  "Fixed strict typed-route and nullable Supabase-result errors revealed after formatting unblocked typecheck.",
                  "Made the tenancy database-contract test additive so later adversarial SQL suites remain required instead of being forbidden.",
                  "Moved the environment-gated academic browser fixture out of Next.js private-folder naming so the production build registers the smoke route."
              ],
              "verification": [
                  {
                      "name": "Canonical GitHub quality gate",
                      "result": "pass",
                      "evidence": [
                          "GitHub Actions run 31570521233 passed on head commit 632b418b00e7c953efb308bdc49480532a8877c7.",
                          "The deterministic gate passed Prettier, ESLint with zero warnings, route type generation, strict TypeScript, 9 test files / 31 tests, and the Next.js 16.3.0 production build."
                      ]
                  },
                  {
                      "name": "Academic-admin browser and mobile evidence",
                      "result": "pass",
                      "evidence": [
                          "The real headless-Chrome journey reached /browser-smoke/academic and verified the academic-admin marker, syllabus publication, class/timetable creation, and both Main Campus and West Campus options.",
                          "Artifact 9131151631 has digest sha256:11c6a4da3617bb19551a5cc4f7d7225df0a069888d1af2d17cd0be35fb6b9243 and contains a 390x844 RGB screenshot plus the rendered DOM."
                      ]
                  },
                  {
                      "name": "TASK-003 hosted database and adversarial verification",
                      "result": "pass",
                      "evidence": [
                          "The previously accepted TASK-003 hosted verification remains applicable because this recovery changed formatting, TypeScript narrowing, test harness assumptions, and the browser fixture only; no TASK-003 migration or database authorization behavior changed.",
                          "That verification covered two branches, multiple subjects/classes, syllabus/objective lineage, timetable integrity, cross-branch assignment rejection, RLS behavior, and fixture cleanup."
                      ]
                  },
                  {
                      "name": "Vercel identity reconciliation",
                      "result": "blocked",
                      "evidence": [
                          "Historical project ID prj_IWxn6mdD5LaB9hc4KtuMujtDoNQ8 belongs to the same known team ID team_BPsOfcrNMh4WJBgbw8eMcXuN, while the current project list is empty.",
                          "Direct project/deployment lookup returns 404 but deployment listing by project ID returns 403, so deletion is not conclusive and duplicate creation is unsafe. BLOCKER-014 remains open."
                      ]
                  }
              ],
              "humanPerspectiveResults": [
                  {"perspective": "Primary user", "result": "pass", "evidence": ["Academic administration exposes the full configured syllabus/class path rather than a scaffold."], "proxy": True},
                  {"perspective": "First-time user", "result": "pass", "evidence": ["The mobile admin fixture groups curriculum and branch operation with explicit action labels."], "proxy": True},
                  {"perspective": "Owner or client", "result": "pass", "evidence": ["The complete quality gate and prior adversarial branch verification now agree with the merged implementation."], "proxy": True},
                  {"perspective": "Maintainer", "result": "pass", "evidence": ["CI now discovers additive database suites and the browser fixture is a registered, environment-gated production route."], "proxy": True},
                  {"perspective": "Failure-state user", "result": "pass", "evidence": ["Recovery uncovered and fixed formatting, strict type, stale contract-test, and browser-route failures instead of bypassing them."], "proxy": True},
                  {"perspective": "Administrator", "result": "pass", "evidence": ["The 390x844 real-Chrome artifact demonstrates branch-scoped academic administration controls at the representative mobile viewport."], "proxy": True}
              ],
              "decisions": [
                  "Treat PR #19 / merge efff9d298319132a0c7b20a6c21ec95d47306c5b as the accepted TASK-003 implementation and this run as corrective verification/state reconciliation, not historical replacement.",
                  "Keep BLOCKER-014 open because 403 deployment-list behavior prevents a conclusive deletion determination; do not create a duplicate Vercel project."
              ],
              "problems": [
                  "BLOCKER-014 remains open and prevents safe production deployment verification.",
                  "BLOCKER-015 remains open for hosted Supabase Auth configuration reconciliation before production release."
              ],
              "outcome": "verified",
              "nextAction": "Implement TASK-004 on a focused branch and preserve the current Vercel blocker until existing project identity can be recovered safely.",
              "startedAt": "2026-08-12T05:58:00Z",
              "endedAt": "2026-08-12T06:36:12Z"
          }
          Path('.loopforge/runs/RUN-0013.json').write_text(json.dumps(run, indent=2) + '\n')

          evidence = '''# RUN-0013 — TASK-003 recovery evidence\n\n- **Task:** TASK-003\n- **Verified head:** `632b418b00e7c953efb308bdc49480532a8877c7`\n- **GitHub Actions:** run `31570521233` — passed\n- **Browser artifact:** `9131151631`\n- **Artifact digest:** `sha256:11c6a4da3617bb19551a5cc4f7d7225df0a069888d1af2d17cd0be35fb6b9243`\n- **Environment:** GitHub hosted Ubuntu 24.04, Node 24.14.0, npm 11.9.0, Next.js 16.3.0, headless Google Chrome\n- **Procedure:** `npm ci`, `npm run verify`, start production server with `SKILLFORGE_BROWSER_SMOKE=1`, dump the real Chrome DOM, assert required academic-admin controls and both branches, then capture the representative mobile screenshot.\n- **Result:** pass\n\n## Deterministic gate\n\nPrettier, zero-warning ESLint, route type generation, strict TypeScript, all 31 tests across 9 files, and the production build passed. The recovery also corrected the additive adversarial-suite contract without removing any substantive security assertions.\n\n## Browser/mobile evidence\n\nThe registered `/browser-smoke/academic` fixture passed its real Chrome journey. The artifact contains the rendered DOM and a verified `390x844` RGB screenshot. Visual inspection confirms a readable single-column mobile hierarchy with no observed horizontal clipping in the captured viewport.\n\n## Database evidence continuity\n\nThe hosted TASK-003 database/adversarial verification from PR #19 remains the authoritative database evidence: two-branch operation, multiple subjects/classes, syllabus/objective lineage, timetable integrity, cross-branch assignment rejection, RLS behavior, and fixture cleanup all passed. This recovery did not alter TASK-003 migrations or database authorization behavior.\n\n## Deployment limitation\n\nProduction deployment was not attempted because BLOCKER-014 remains unresolved. The historical Vercel project cannot be conclusively classified as deleted: direct lookups return 404 while deployment listing by its project ID returns 403. Creating another project would risk duplicating the intended canonical project.\n'''
          Path('.loopforge/evidence/RUN-0013-task-003-recovery.md').write_text(evidence)

          status = '''# SkillForge Status\n\n**LoopForge mode:** new / resume  \n**Protocol lock:** LoopForge 1.0.0 at `4acadb5e75acd0ebd5bcbd1f1d522c710bd6722d`  \n**Project status:** active  \n**Current phase:** READY  \n**Active task:** TASK-004 — Implement the guided teacher class lifecycle  \n**Last verified task:** TASK-003  \n**Last verified application commit:** `632b418b00e7c953efb308bdc49480532a8877c7`  \n**Last run:** RUN-0013\n\n## Verified foundation\n\nTASK-001, TASK-002, and TASK-003 are complete. TASK-003 is implemented by merged PR #19 and its recovery verification passed the full canonical quality gate plus a real headless-Chrome academic-admin journey with 390×844 mobile evidence. The already-passed hosted two-branch database/adversarial verification remains valid because the recovery changed no academic migration or authorization behavior.\n\n## Current work\n\nTASK-004 is ready and active: Start Class, attendance, session-state enforcement, transcript/resource upload and retry recovery, homework, AI-review placeholder only, explicit teacher review, Publish gate, and a mobile-first teacher workflow. Production AI inference remains excluded.\n\n## Infrastructure\n\n- Supabase: exactly one authorized project, `qvrqitirdxmckdqmysqu` in `ap-south-1`.\n- Vercel: BLOCKER-014 remains open. Historical project `prj_IWxn6mdD5LaB9hc4KtuMujtDoNQ8` maps to team `team_BPsOfcrNMh4WJBgbw8eMcXuN`; current project listing is empty, direct lookups return 404, and deployment listing returns 403. This is not conclusive deletion, so no replacement project may be created yet.\n- Canonical production destination remains `https://skillforge-bay-three.vercel.app`.\n- Hosted Supabase Auth reconciliation remains BLOCKER-015 before production release.\n\n## Next action\n\nImplement and verify TASK-004 as the largest safe coherent bundle, then deliver it according to the pinned protocol.\n'''
          Path('STATUS.md').write_text(status)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .loopforge STATUS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: reconcile verified TASK-003 state'
          git push origin HEAD:${{ github.head_ref }}
