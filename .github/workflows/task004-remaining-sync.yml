name: TASK-004 remaining sync

on:
  push:
    branches:
      - loopforge/task-004-teacher-lifecycle

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: loopforge/task-004-teacher-lifecycle
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Materialize remaining TASK-004 artifacts
        run: |
          xz -dc .tmp/task004-remaining.tar.xz | tar -xf -
          npx prettier --write src/types/database.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types/database.ts \
            supabase/migrations/20260812065000_teacher_class_lifecycle.sql \
            supabase/tests/003_teacher_class_lifecycle_rls.sql
          git rm .tmp/task004-remaining.tar.xz .github/workflows/task004-remaining-sync.yml
          git commit -m 'feat: add trusted teacher lifecycle database [TASK-004]'
          git push origin HEAD:loopforge/task-004-teacher-lifecycle
